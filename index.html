<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body>

    <div class="top">
        <h1>Flash Card</h1>
    </div>
    <div class="middle">
        <div class="flashCard">
            <div class="content"></div>
        </div>
    </div>
    <div class="bottom">
        <button class="flip-btn">Flip</button>
        <button class="next-btn">Next</button>
    </div>
    <div class="create-card-area">
        <h3>Add a New Card</h3>
        <input type="text" id="front-input" placeholder="Front Side (Question)">
        <input type="text" id="back-input" placeholder="Back Side (Answer)">
        <button id="save-btn">Save to Cloud</button>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
